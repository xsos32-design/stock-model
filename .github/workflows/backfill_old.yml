name: backfill-old-10y
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: backfill
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        name: [price, disposition, revenue, fin]
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      START: "2014-11-01"
      END: "2021-11-15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: price
        if: matrix.name == 'price'
        env:
          OUTDIR: data/old/price_adj
        run: python scripts/backfill_price.py
      - name: factor
        if: matrix.name != 'price'
        env:
          OUTDIR: data/old/factors
        run: |
          git pull --rebase || true
          IDS=$( [ -f data/old/price_adj/universe.csv ] && echo data/old/price_adj/universe.csv || echo data/universe.csv ) python scripts/fetch_factors.py ${{ matrix.name }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/old/
          git commit -m "data: old ${{ matrix.name }}" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
