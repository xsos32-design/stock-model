name: daily-update
on:
  schedule:
    - cron: "10 10 * * 1-5"    # 18:10 Taipei, after TW close data is published
    - cron: "40 22 * * 0-4"    # 06:40 Taipei, refresh US night before the TW open
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: Update
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -f data/live/prices.parquet ]; then python scripts/daily_update.py; else python scripts/daily_update.py --init; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live docs/data
          git commit -m "daily update" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
