name: daily-update
on:
  schedule:
    - cron: "10 10 * * 1-5"    # 18:10 Taipei, after TW close data is published
    - cron: "40 22 * * 0-4"    # 06:40 Taipei, refresh US night before the TW open
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: daily
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: Build site
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SITE: _site
        run: |
          mkdir -p _site && cp docs/index.html _site/
          python scripts/daily_update.py
      - name: Commit state (small append-only files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git commit -m "daily state" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
